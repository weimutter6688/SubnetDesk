name: SubnetDesk Preflight

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: subnetdesk-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: LAN-only, branding, and generated assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check LAN-only residuals
        run: bash scripts/check_lan_only_residuals.sh

      - name: Check verified build downloads
        run: |
          python3 scripts/test_download_verified.py
          ! grep -E 'raw/(master|main)/|curl .*(https?://)|wget .*(https?://)|Invoke-WebRequest' .github/workflows/flutter-build.yml

      - name: Check SubnetDesk branding and icons
        run: bash scripts/check_subnetdesk_branding.sh

      - name: Check installer artifact contract
        run: |
          trap 'echo "::error title=Installer artifact contract::Command failed at line $LINENO: $BASH_COMMAND"' ERR
          grep -Fq 'upload-artifact: true' .github/workflows/flutter-ci.yml
          grep -Fq 'publish-release: false' .github/workflows/flutter-ci.yml
          grep -Fq 'build-mobile: false' .github/workflows/flutter-ci.yml
          grep -Fq 'publish-release:' .github/workflows/flutter-tag.yml
          grep -Fq 'publish-release: true' .github/workflows/flutter-nightly.yml
          grep -Fq 'branches:' .github/workflows/flutter-nightly.yml
          grep -Fq '      - master' .github/workflows/flutter-nightly.yml
          ! grep -Fq 'Delete all existing nightly assets' .github/workflows/flutter-nightly.yml
          grep -Fq 'publish-release:' .github/workflows/flutter-build.yml
          python3 scripts/build_with_diagnostics.py python3 scripts/test_release.py
          grep -Fq 'flutter build linux --release --target-platform linux-arm64' .github/workflows/flutter-build.yml
          grep -Eq 'dart-.*-linux-arm64 --output dart-sdk.zip' .github/workflows/flutter-build.yml
          grep -Fq 'rm -f flutter/bin/cache/flutter_tools.snapshot flutter/bin/cache/flutter_tools.stamp' .github/workflows/flutter-build.yml
          grep -Fq 'flutter precache --linux --force' .github/workflows/flutter-build.yml
          ! grep -Fq 'flutter-elinux' .github/workflows/flutter-build.yml
          ! grep -Fq "features.append('software-update')" build.py
          ! grep -Fq 'software-update' flutter/run.sh
          sed -n '/^  build-for-windows-flutter:/,/^  build-for-windows-sciter:/p' .github/workflows/flutter-build.yml | grep -E 'toolchain:.*env\.RUST_VERSION' > /dev/null
          for artifact in \
            'name: subnetdesk-windows-' \
            'name: subnetdesk-macos-' \
            'name: subnetdesk-linux-rpm-' \
            'name: subnetdesk-archlinux-' \
            'name: subnetdesk-appimage-' \
            'name: subnetdesk-flatpak-'
          do
            grep -Fq "$artifact" .github/workflows/flutter-build.yml
          done

      - name: Check Android signing contract
        run: |
          grep -Fq 'ANDROID_SIGNING_CERT_SHA256' .github/workflows/flutter-build.yml
          grep -Fq 'Verify fixed Android signing certificate' .github/workflows/flutter-build.yml
          grep -Fq 'scripts/extract_android_cert_sha256.sh' .github/workflows/flutter-build.yml
          ! grep -Fq 'Publish unsigned apk package' .github/workflows/flutter-build.yml
          expected=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          for output in \
            "Signer #1 certificate SHA-256 digest: $expected" \
            "V2 Signer: certificate SHA-256 digest: $expected"
          do
            actual=$(printf '%s\n' "$output" | bash scripts/extract_android_cert_sha256.sh)
            test "$actual" = "$expected"
          done

      - name: Check release upload retry contract
        run: |
          bash scripts/check_release_upload_retry.sh
          bash scripts/test_publish_release.sh

      - name: Check Python scripts
        run: python3 -m py_compile build.py scripts/generate_subnetdesk_icons.py scripts/download_verified.py

      - name: Check workflow syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.parse_file(path) }'
