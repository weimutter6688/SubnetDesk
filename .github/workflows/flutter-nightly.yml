name: SubnetDesk Nightly Build

permissions:
  contents: write

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README*"
      - ".github/workflows/ci.yml"
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: subnetdesk-nightly-release
  cancel-in-progress: true

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      publish-release: true
      build-mobile: false
      upload-tag: "nightly"
      linux-extras: false
