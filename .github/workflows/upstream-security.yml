name: Upstream security review queue

on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 scripts/check_upstream_security.py --output upstream-security-review.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-security-review
          path: upstream-security-review.md
          retention-days: 90
